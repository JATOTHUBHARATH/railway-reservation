<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revenue Report | Railway Reservation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <span class="brand">🚆 Railway Reservation</span>
    <div class="links">
      <a href="trains.html">Trains</a>
      <a href="passengers.html">Passengers</a>
      <a href="book.html">Book</a>
      <a href="bookings.html">Bookings</a>
      <a href="report.html" class="active">Report</a>
    </div>
  </nav>

  <main class="container">
    <h1>Revenue Report</h1>

    <section class="card">
      <div id="summary" class="summary"></div>
    </section>

    <section class="card">
      <h2 class="card-title">Revenue per train (confirmed bookings)</h2>
      <div id="bars"></div>
    </section>

    <section class="card">
      <table>
        <thead>
          <tr><th>Train</th><th>Bookings</th><th>Revenue (₹)</th></tr>
        </thead>
        <tbody id="reportBody">
          <tr><td colspan="3" class="muted">Loading...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/report.js"></script>
</body>
</html>
