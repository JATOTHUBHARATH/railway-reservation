<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trains | Railway Reservation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <span class="brand">🚆 Railway Reservation</span>
    <div class="links">
      <a href="trains.html" class="active">Trains</a>
      <a href="passengers.html">Passengers</a>
      <a href="book.html">Book</a>
      <a href="bookings.html">Bookings</a>
      <a href="report.html">Report</a>
    </div>
  </nav>

  <main class="container">
    <h1>Trains</h1>

    <section class="card">
      <div class="toolbar">
        <input id="search" type="text" placeholder="Search by name, source or destination...">
        <button id="addToggle" class="btn">+ Add train</button>
      </div>

      <form id="addForm" class="grid-form hidden">
        <input name="train_id" type="number" placeholder="Train ID" required min="1">
        <input name="train_name" type="text" placeholder="Train name" required>
        <input name="source" type="text" placeholder="Source" required>
        <input name="destination" type="text" placeholder="Destination" required>
        <input name="departure_time" type="time" required>
        <input name="total_seats" type="number" placeholder="Total seats" required min="1">
        <input name="fare" type="number" placeholder="Fare per seat" required min="1" step="0.01">
        <button type="submit" class="btn primary">Save train</button>
      </form>
    </section>

    <section class="card">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Name</th><th>From</th><th>To</th>
            <th>Departs</th><th>Seats left</th><th>Fare (₹)</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="trainBody">
          <tr><td colspan="8" class="muted">Loading...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/trains.js"></script>
</body>
</html>
